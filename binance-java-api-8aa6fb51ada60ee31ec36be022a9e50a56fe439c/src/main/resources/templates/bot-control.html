<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Control - Trading Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .status-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .status-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-value {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 5px;
        }
        
        .status-running {
            background: #10b981;
            color: white;
        }
        
        .status-stopped {
            background: #6b7280;
            color: white;
        }
        
        .status-starting {
            background: #3b82f6;
            color: white;
        }
        
        .status-stopping {
            background: #f59e0b;
            color: white;
        }
        
        .status-error {
            background: #ef4444;
            color: white;
        }
        
        .status-text {
            margin-top: 10px;
            font-size: 0.95em;
            color: #555;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .notification {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .notification.show {
            display: block;
        }
        
        .notification.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        
        .notification.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .notification.warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }
        
        .info-text {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link a:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Trading Bot Control</h1>
        
        <div id="notification" class="notification"></div>
        
        <div class="status-card">
            <div class="status-label">Bot Status</div>
            <div id="botStatusBadge" class="status-value status-stopped">UNBEKANNT</div>
            <div id="statusText" class="status-text">Status wird geladen...</div>
        </div>
        
        <div class="controls">
            <button id="startBotBtn" class="btn btn-start" onclick="startBot()">
                ▶️ Start Bot
            </button>
            <button id="stopBotBtn" class="btn btn-stop" onclick="stopBot()" disabled>
                ⏹️ Stop Bot
            </button>
        </div>
        
        <div class="info-text">
            Der Status wird automatisch alle 3 Sekunden aktualisiert
        </div>
        
        <div class="back-link">
            <a href="/dashboard">← Zurück zum Dashboard</a>
        </div>
    </div>

    <script>
        // Status-Update Interval
        let statusUpdateInterval = null;

        /**
         * Initialisiert die Bot-Steuerung beim Laden der Seite.
         */
        function init() {
            updateBotStatus();
            statusUpdateInterval = setInterval(updateBotStatus, 3000);
        }

        /**
         * Startet den Trading-Bot.
         */
        async function startBot() {
            const startBtn = document.getElementById('startBotBtn');
            const originalText = startBtn.innerHTML;
            
            startBtn.disabled = true;
            startBtn.innerHTML = '⏳ Starte...<span class="spinner"></span>';
            
            try {
                const response = await fetch('/api/bot/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('success', '✅ ' + data.message);
                } else {
                    showNotification('warning', '⚠️ ' + data.message);
                }
                
                updateBotStatus();
                
            } catch (error) {
                console.error('Fehler beim Starten des Bots:', error);
                showNotification('error', '❌ Fehler beim Starten: ' + error.message);
            } finally {
                startBtn.innerHTML = originalText;
            }
        }

        /**
         * Stoppt den Trading-Bot.
         */
        async function stopBot() {
            if (!confirm('Möchten Sie den Bot wirklich stoppen?')) {
                return;
            }
            
            const stopBtn = document.getElementById('stopBotBtn');
            const originalText = stopBtn.innerHTML;
            
            stopBtn.disabled = true;
            stopBtn.innerHTML = '⏳ Stoppe...<span class="spinner"></span>';
            
            try {
                const response = await fetch('/api/bot/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('success', '✅ ' + data.message);
                } else {
                    showNotification('warning', '⚠️ ' + data.message);
                }
                
                updateBotStatus();
                
            } catch (error) {
                console.error('Fehler beim Stoppen des Bots:', error);
                showNotification('error', '❌ Fehler beim Stoppen: ' + error.message);
            } finally {
                stopBtn.innerHTML = originalText;
            }
        }

        /**
         * Aktualisiert den Bot-Status in der Oberfläche.
         */
        async function updateBotStatus() {
            try {
                const response = await fetch('/api/bot/status');
                const data = await response.json();
                
                // Status-Badge aktualisieren
                const statusBadge = document.getElementById('botStatusBadge');
                const statusText = document.getElementById('statusText');
                
                if (statusBadge) {
                    statusBadge.textContent = data.status;
                    statusBadge.className = 'status-value ' + getStatusClass(data.status);
                }
                
                if (statusText) {
                    statusText.textContent = data.statusText || data.status;
                }
                
                // Buttons aktivieren/deaktivieren
                const startBtn = document.getElementById('startBotBtn');
                const stopBtn = document.getElementById('stopBotBtn');
                
                if (data.isRunning || data.status === 'STARTING') {
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }
                
            } catch (error) {
                console.error('Fehler beim Abrufen des Bot-Status:', error);
            }
        }

        /**
         * Gibt die CSS-Klasse für den Status zurück.
         */
        function getStatusClass(status) {
            switch(status) {
                case 'RUNNING': return 'status-running';
                case 'STOPPED': return 'status-stopped';
                case 'STARTING': return 'status-starting';
                case 'STOPPING': return 'status-stopping';
                case 'ERROR': return 'status-error';
                default: return 'status-stopped';
            }
        }

        /**
         * Zeigt eine Benachrichtigung an.
         */
        function showNotification(type, message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type + ' show';
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        // Initialisierung beim Laden
        document.addEventListener('DOMContentLoaded', init);

        // Cleanup beim Verlassen
        window.addEventListener('beforeunload', () => {
            if (statusUpdateInterval) {
                clearInterval(statusUpdateInterval);
            }
        });
    </script>
</body>
</html>
